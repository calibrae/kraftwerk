name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write     # create releases + upload assets

# Tauri's bundler refuses to produce updater artifacts when the public
# key is present in tauri.conf.json but the matching private key isn't
# in the environment. Set the signing env globally so every platform's
# `tauri build` can sign its .tar.gz / .zip update artifact.
env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  build-linux:
    name: linux bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install libvirt + tauri deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libvirt-dev pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: kraftwerk-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm

  build-macos:
    # Apple Silicon only. GitHub retired free Intel runners in early 2026
    # and building Intel from this self-hosted arm64 runner would need
    # Intel Homebrew + libvirt locally. Manual x86_64 build instructions
    # live in the README for anyone who needs one.
    name: macos aarch64 signed bundle
    runs-on: [self-hosted, macOS, mini]
    env:
      APPLE_SIGNING_IDENTITY: 'Developer ID Application: Nico Bousquet (XJQQCN392F)'
      APPLE_API_KEY: Z43Q26MB7Y
      APPLE_API_KEY_PATH: /Users/cali/.privatekeys/AuthKey_Z43Q26MB7Y.p8
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_TEAM_ID: XJQQCN392F
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - name: unlock login keychain for codesign
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" ~/Library/Keychains/login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" ~/Library/Keychains/login.keychain-db
      - name: ensure dylibbundler + dmgbuild
        run: |
          command -v dylibbundler >/dev/null 2>&1 || brew install dylibbundler
          # dmgbuild over create-dmg: create-dmg drives Finder via
          # AppleScript to lay out the window, which times out on the
          # CI runner's LaunchAgent (no active desktop session →
          # AppleEvent -1712). dmgbuild writes the .DS_Store directly.
          if ! command -v dmgbuild >/dev/null 2>&1; then
            command -v pipx >/dev/null 2>&1 || brew install pipx
            pipx install dmgbuild
          fi
          # pipx installs to ~/.local/bin which isn't always on PATH
          # in non-login shells.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: tauri build (sign + notarize)
        run: npm run tauri build
      - name: bundle libvirt + transitive dylibs into .app
        run: ./scripts/bundle_macos_dylibs.sh src-tauri/target/release/bundle/macos/Kraftwerk.app
      - name: re-tar + re-sign .app for the updater
        # tauri build produced an .app.tar.gz BEFORE dylib bundling — it
        # would install a broken app on update. Repack the post-bundle
        # .app and re-sign the tarball with the minisign key so
        # tauri-plugin-updater accepts it.
        run: |
          set -eu
          APP=src-tauri/target/release/bundle/macos/Kraftwerk.app
          OUT="src-tauri/target/release/bundle/macos/Kraftwerk.app.tar.gz"
          rm -f "$OUT" "$OUT.sig"
          tar -C "$(dirname "$APP")" -czf "$OUT" "$(basename "$APP")"
          npx --yes @tauri-apps/cli signer sign \
            --private-key "$TAURI_SIGNING_PRIVATE_KEY" \
            --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
            "$OUT"
      - name: rebuild DMG with installer-style layout
        # tauri build's DMG was built before we vendored libvirt into the
        # bundle, so it contains the pre-fix binary. Discard it and build
        # a fresh installer-style DMG via dmgbuild — single window, large
        # Kraftwerk.app icon, Applications drop-link, no AppleScript /
        # Finder roundtrip (see ensure-dmgbuild step for why).
        run: |
          set -eu
          export KRAFTWERK_APP=src-tauri/target/release/bundle/macos/Kraftwerk.app
          VERSION=$(node -p "require('./package.json').version")
          OUT="src-tauri/target/release/bundle/dmg/Kraftwerk_${VERSION}_aarch64.dmg"
          rm -f "$OUT"
          mkdir -p src-tauri/target/release/bundle/dmg
          dmgbuild -s scripts/dmg_settings.py "Kraftwerk" "$OUT"
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" "$OUT"
      - name: install playwright (for tier 3 bundle smoke)
        run: |
          npx playwright install chromium >/dev/null 2>&1 || true
      - name: tier 3 — verify the bundled .app actually launches
        env:
          KRAFTWERK_E2E_BIN: src-tauri/target/release/bundle/macos/Kraftwerk.app/Contents/MacOS/kraftwerk
        run: npm run test:e2e:bundle
      - name: re-notarize the new DMG
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -eu
          VERSION=$(node -p "require('./package.json').version")
          DMG="src-tauri/target/release/bundle/dmg/Kraftwerk_${VERSION}_aarch64.dmg"
          xcrun notarytool submit "$DMG" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$DMG"
      - name: write updater manifest (latest.json)
        # latest.json is what tauri-plugin-updater fetches to discover a
        # new version. We hard-code the GitHub release asset URL using
        # the current tag, which softprops/action-gh-release publishes
        # the .app.tar.gz under in the release step below.
        run: |
          set -eu
          export VERSION=$(node -p "require('./package.json').version")
          export ASSET=Kraftwerk.app.tar.gz
          export SIG=$(cat "src-tauri/target/release/bundle/macos/${ASSET}.sig")
          export URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/${ASSET}"
          export PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          export NOTES=$(git log -1 --pretty=%s)
          mkdir -p src-tauri/target/release/updater
          node -e '
            const fs = require("fs");
            const { VERSION, NOTES, PUB_DATE, SIG, URL } = process.env;
            fs.writeFileSync("src-tauri/target/release/updater/latest.json", JSON.stringify({
              version: VERSION,
              notes: NOTES,
              pub_date: PUB_DATE,
              platforms: { "darwin-aarch64": { signature: SIG, url: URL } }
            }, null, 2));
          '
          cat src-tauri/target/release/updater/latest.json
      - uses: actions/upload-artifact@v4
        with:
          name: kraftwerk-macos-aarch64
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/release/updater/latest.json

  build-windows:
    name: windows bundle (experimental)
    runs-on: windows-latest
    continue-on-error: true   # libvirt on Windows is second-class
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: kraftwerk-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  release:
    name: publish release
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
